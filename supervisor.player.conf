
[program:player]
environment=
	DISPLAY=:0,
	XDG_RUNTIME_DIR=/run/user/1000,
	HOME="/home/user",
	USER="user"

user=user

command=bash -c "sleep 30 && exec google-chrome --start-fullscreen --remote-debugging-port=9222 --hide-crash-restore-bubble --user-data-dir=/home/user/foxtel_watcher/ChromeProfile"

autostart=true
autorestart=true


stdout_logfile=/home/user/foxtel_watcher/player.log
stderr_logfile=/home/user/foxtel_watcher/player.log


[program:player_log_viewer]
environment=
	DISPLAY=:0,
	XDG_RUNTIME_DIR=/run/user/1000,
	HOME="/home/user",
	USER="user"

user=user
command=bash -c "sleep 22 && exec xterm -T 'Player Log' -fa 'Monospace' -fs 14 -geometry 140x40 -e tail -F /home/user/foxtel_watcher/player.log"
autostart=true
autorestart=true

